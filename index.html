<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link rel="stylesheet" href="love2.css">
</head>
<body>
    <div class="question container">
        <video src="please.mp4" autoplay loop muted class="gif1"></video>
        <h2>Will you be my Valentine💖?</h2>
        <div class="btn-container">
            <button class="btn" id="yesBtn">Yes</button>
            <button class="btn" id="noBtn">No</button>
        </div>
    </div>
    <div class="reply container">
        <video src="reply.mp4" autoplay loop muted class="gif2"></video>
        <h2>I knew it 🤗</h2>
        <h2>Congrats! You unlocked my heart❤️!!</h2>
    </div>
    <div class="css-main">
        <div class="css-rotate">
            <div class="css-heart">
                <span class="css-heartL"></span>
                <span class="css-heartR"></span>
                <span class="css-square"></span>
            </div>
        </div>
    </div>
    <script src="love2.js"></script>
</body>
</html>
